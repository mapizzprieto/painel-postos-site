<title>Embaixada em Liubliana</title>
<link rel="stylesheet" href="../comum/barlow.css">
<style>
  :root {
    --fundo: #f6f5f2; --cartao: #ffffff; --texto: #1d1f22; --suave: #6b6f76;
    --linha: #e6e4df; --destaque: #23533f; --alerta: #b4532a; --medio: #b08a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #141517; --cartao: #1e2023; --texto: #ecebe8; --suave: #9a9ea5;
            --linha: #2e3034; --destaque: #7cc4a2; --alerta: #e58b62; --medio: #d9b44a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font: 16px/1.4 Barlow, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 14px 40px; }
  .local { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
  h1 { font-size: 28px; line-height: 1.1; margin: 4px 0 6px; font-weight: 700; }
  .endereco { color: var(--suave); font-size: 15px; margin: 0 0 14px; }
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--suave); margin-bottom: 18px; }
  .bloco { margin: 14px 0 4px; }
  .bloco > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
           font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--texto, #222); font-weight: 700;
           padding: 8px 2px 6px; border-bottom: 1px solid var(--linha); margin-bottom: 10px; }
  .bloco > summary::-webkit-details-marker { display: none; }
  .bloco > summary::before { content: ''; border-style: solid; border-width: 5px 0 5px 7px;
           border-color: transparent transparent transparent currentColor; transition: transform .15s; }
  .bloco[open] > summary::before { transform: rotate(90deg); }
  .tema { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .tema > summary { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
                   font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
  .tema > summary::before { content: ''; width: 0; height: 0; border-style: solid;
                           border-width: 5px 0 5px 7px; border-color: transparent transparent transparent currentColor;
                           transition: transform .15s; flex: none; }
  .tema[open] > summary::before { transform: rotate(90deg); }
  .tema[open] > summary { padding-bottom: 8px; }
  .voltar { display: inline-block; margin-bottom: 10px; color: var(--destaque); text-decoration: none; font-size: 14px; }
  .tema details { border-top: 1px solid var(--linha); }
  .tema details summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
            padding: 11px 14px; align-items: start; }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  .rotulo { color: var(--suave); font-size: 14px; grid-column: 1 / -1; display: flex; justify-content: space-between; }
  .valor { font-weight: 600; font-size: 16px; grid-column: 1 / -1; }
  .valor .par { display: block; margin-top: 0.7em; }
  .resumo .valor { font-weight: 400; font-size: 15px; line-height: 1.45; color: var(--texto); }
  .conf { display: inline-flex; gap: 3px; align-items: center; }
  .conf i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
  .conf i.on { background: currentColor; }
  .c-alta { color: var(--destaque); } .c-media { color: var(--medio); }
  .c-baixa, .c-sem { color: var(--alerta); }
  .detalhe { padding: 0 14px 14px; font-size: 14px; color: var(--suave); }
  .detalhe p { margin: 0 0 8px; }
  .detalhe .nota { color: var(--texto); }
  .detalhe a { color: var(--destaque); word-break: break-word; }
  .detalhe ul { margin: 0 0 8px; padding-left: 18px; }
  details[open] summary .valor { color: var(--destaque); }
  .conflito { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--alerta); }
  .relogios { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--linha); }
  .relogio { padding: 10px 8px 12px; min-width: 0; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "onde onde onde" "an hora cal";
             align-items: center; column-gap: 5px; row-gap: 6px; }
  .relogio + .relogio { border-left: 1px solid var(--linha); }
  .relogio .onde { grid-area: onde; color: var(--suave); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .relogio .gmt { font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 3px; }
  .relogio .hora { grid-area: hora; font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .analogico { grid-area: an; flex: none; }
  .analogico .face { fill: var(--cartao); stroke: var(--texto); stroke-width: 3; }
  .analogico .marca, .analogico .ponteiro { stroke: var(--texto); stroke-linecap: round; }
  .analogico .eixo { fill: var(--destaque); }
  .analogico.noite .face { fill: var(--texto); }
  .analogico.noite .marca, .analogico.noite .ponteiro { stroke: var(--cartao); }
  /* folhinha de arrancar */
  .folhinha { grid-area: cal; display: flex; flex-direction: column; position: relative; width: 40px; height: 52px; text-align: center; line-height: 1;
              filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); padding-top: 3px; }
  .folhinha .aros { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 8px; z-index: 1; }
  .folhinha .aros i { width: 3px; height: 6px; border-radius: 2px; background: var(--suave); }
  .folhinha .topo { background: var(--alerta); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .06em;
                    text-transform: uppercase; padding: 4px 0 2px; border-radius: 3px 3px 0 0; }
  .folhinha .folha { flex: 1; display: flex; flex-direction: column; justify-content: center; background: var(--cartao); border: 1px solid var(--linha); border-top: 0; padding: 1px 0 5px;
                     clip-path: polygon(0 0, 100% 0, 100% 100%, 87.5% calc(100% - 4px), 75% 100%, 62.5% calc(100% - 4px), 50% 100%,
                       37.5% calc(100% - 4px), 25% 100%, 12.5% calc(100% - 4px), 0 100%); }
  .folhinha .num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .folhinha .mes { font-size: 9px; color: var(--suave); text-transform: lowercase; margin-top: 1px; }
  .grafico { padding: 12px 14px 6px; border-top: 1px solid var(--linha); color: var(--destaque); }
  .grafico-titulo { color: var(--suave); font-size: 14px; margin-bottom: 4px; }
  .grafico-nota { color: var(--suave); font-size: 12px; margin-top: 4px; line-height: 1.35; }
  .referencia { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--linha);
                color: var(--suave); font-size: 14px; }
  .referencia .opcoes { display: inline-flex; border: 1px solid var(--destaque); border-radius: 8px; overflow: hidden; }
  .referencia button { font: inherit; font-weight: 600; padding: 5px 16px; border: 0; background: transparent;
                       color: var(--destaque); cursor: pointer; }
  .referencia button[aria-pressed="true"] { background: var(--destaque); color: var(--cartao); }
  .tema[data-ref="usd"] .ref-brl, .tema[data-ref="brl"] .ref-usd { display: none; }
  .grafico svg text { fill: var(--suave); }
  .item-vazio { display: block; padding: 12px 14px; border-top: 1px solid var(--linha); }
  .item-vazio .rotulo { display: block; color: var(--suave); font-size: 14px; }
  .item-vazio .valor { display: block; color: var(--suave); font-style: italic; margin-top: 2px; }
  .vazio-com-fonte summary .valor.vazio-valor { color: var(--suave); font-style: italic; font-weight: 400; }
  .mapa { border-top: 1px solid var(--linha); padding: 10px 14px 12px; }
  .mapa-tela { position: relative; border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; background: #dfe9ef; touch-action: none; }
  .mapa-tela > svg { display: block; width: 100%; height: 340px; cursor: crosshair; }
  .mapa .terra { fill: #f4f1ea; stroke: #c9c3b6; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .mapa .linha { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .mapa .estrela { pointer-events: none; }
  .mapa .marca { fill: #fff; stroke: var(--destaque); pointer-events: none; }
  .mapa .leaflet { height: 380px; }
  .rotulo-mapa { font: 600 11px/1 Barlow, system-ui, sans-serif; color: #50545b; white-space: nowrap; transform: translate(-50%, -50%);
                 text-shadow: 0 0 2px #f3f0ea, 0 0 3px #f3f0ea, 0 0 4px #f3f0ea; pointer-events: none; }
  .rotulo-mapa.cidade { font-size: 13px; color: #33363c; }
  .rotulo-estacao { font: 600 11px/1 Barlow, system-ui, sans-serif; color: #1d1f22; white-space: nowrap; pointer-events: none;
                    transform: translate(8px, -50%); text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff; }
  @media (prefers-color-scheme: dark) { .rotulo-estacao { color: #ecebe8; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 0 4px #000; } }
  @media (prefers-color-scheme: dark) { .rotulo-mapa, .rotulo-mapa.cidade { color: #c9cbd0; text-shadow: 0 0 2px #212327, 0 0 3px #212327, 0 0 4px #212327; } }
  .mapa .estrela-ll { font-size: 26px; line-height: 26px; text-align: center; color: #1d1f22; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .mapa-zoom { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
  .mapa-zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--linha); background: var(--cartao); color: var(--texto); font: 600 18px Barlow, sans-serif; }
  .mapa-dica { font-size: 12px; color: var(--suave); margin-top: 6px; }
  .mapa-horario { display: flex; gap: 6px; margin-top: 10px; }
  .mapa-horario button { flex: 1; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--linha); background: var(--cartao); color: var(--suave); font: 500 14px Barlow, sans-serif; }
  .mapa-horario button.ativo { background: var(--destaque); border-color: var(--destaque); color: #fff; }
  .mapa-info { margin-top: 10px; font-size: 15px; }
  .mapa-info .nome { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .mi-linha { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dotted var(--linha); }
  .mi-rot { color: var(--suave); white-space: nowrap; }
  .mi-val { text-align: right; }
  .mi-sub { margin-top: 10px; font-weight: 600; }
  .mi-fonte { font-size: 12px; color: var(--suave); margin-top: 4px; }
  .mi-aviso { color: var(--suave); }
  .mi-link { display: inline-block; margin-top: 10px; }
  .valor a { color: inherit; }
  .mapa-info a { color: var(--destaque); }
  footer { font-size: 13px; color: var(--suave); margin-top: 20px; }
</style>

<script>
(function () {
  var d = JSON.parse(document.getElementById('dados').textContent);
  var NIVEL = { pais: 'vale para todo o país', cidade: 'vale para a cidade', posto: 'específico do posto' };
  var CONF = { alta: 3, media: 2, baixa: 1, sem: 0 };
  var CONF_TXT = { alta: 'confiança alta', media: 'confiança média', baixa: 'confiança baixa', sem: 'sem informação' };

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function selo(c) {
    var s = el('span', 'conf c-' + c);
    s.title = CONF_TXT[c];
    for (var i = 0; i < 3; i++) s.appendChild(el('i', i < CONF[c] ? 'on' : ''));
    return s;
  }
  // diferença atual calculada no navegador, para que "atualmente" seja sempre verdade
  function minutosDoFuso(tz, quando) {
    var p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(quando);
    var v = {}; p.forEach(function (x) { v[x.type] = +x.value; });
    return (Date.UTC(v.year, v.month - 1, v.day, v.hour, v.minute) - quando.getTime()) / 60000;
  }
  function horasTexto(min) {
    var s = min > 0 ? '+' : (min < 0 ? '−' : ''), a = Math.abs(Math.round(min)), h = Math.floor(a / 60), m = a % 60;
    return (min === 0 ? '0' : s + h) + ' h' + (m ? m : '');
  }
  function diferencaAtual() {
    try {
      var agora = new Date();
      agora.setSeconds(0, 0);
      var atual = minutosDoFuso(d.fuso_iana, agora) - minutosDoFuso('America/Sao_Paulo', agora);
      var txt = horasTexto(atual);
      if (d.fuso_base_min !== null && atual !== d.fuso_base_min)
        txt += ' — atualmente em horário de verão (normal é ' + horasTexto(d.fuso_base_min) + ')';
      return txt;
    } catch (e) { return null; }
  }

  function item(it, tema) {
    var soData = it.variavel === 'diferenca_brasilia';
    if (it.vazio && it.fontes.length) {
      // sem dado para este posto, mas a fonte usada para a variável existe: mostra onde se procurou
      var dv = el('details', 'vazio-com-fonte');
      var sv = el('summary');
      var rv = el('span', 'rotulo'); rv.appendChild(el('span', null, it.rotulo)); sv.appendChild(rv);
      sv.appendChild(el('span', 'valor vazio-valor', it.valor));
      dv.appendChild(sv);
      var bv = el('div', 'detalhe');
      bv.appendChild(el('p', 'nota', 'Fonte consultada, sem dado para este posto:'));
      var ulv = el('ul');
      it.fontes.forEach(function (f) { var li = el('li'); var a = el('a', null, f.titulo); a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a); ulv.appendChild(li); });
      bv.appendChild(ulv);
      dv.appendChild(bv);
      return dv;
    }
    if (it.vazio) {
      var vz = el('div', 'item-vazio');
      vz.appendChild(el('span', 'rotulo', it.rotulo));
      vz.appendChild(el('span', 'valor', it.valor));
      return vz;
    }
    var det = el('details', it.variavel === 'descricao' ? 'resumo' : null);
    var sum = el('summary');
    var rot = el('span', 'rotulo');
    // parágrafo de abertura da aba: sem rótulo ("Em resumo"), direto no texto
    rot.appendChild(el('span', null, it.variavel === 'descricao' ? '' : it.rotulo));
    if (!it.link) rot.appendChild(selo(it.confianca));   // link (ex.: Numbeo) não é dado: sem selo nem data
    sum.appendChild(rot);
    var val = el('span', 'valor');
    var texto = it.valor + (it.unidade ? ' ' + it.unidade : '');
    if (it.variavel === 'diferenca_brasilia' && d.fuso_iana) texto = diferencaAtual() || texto;
    // linha em branco (\n\n) separa parágrafos; "; " quebra a linha dentro do parágrafo
    if (it.link) {
      var al = el('a', null, texto);
      al.href = it.link; al.target = '_blank'; al.rel = 'noopener';
      al.addEventListener('click', function (e) { e.stopPropagation(); });
      val.appendChild(al); texto = '';
    }
    if (texto) texto.split('\n\n').forEach(function (par, j) {
      var alvo = val;
      if (j) { alvo = el('span', 'par'); val.appendChild(alvo); }
      par.split('; ').forEach(function (parte, i) {
        if (i) alvo.appendChild(document.createElement('br'));
        alvo.appendChild(document.createTextNode(parte));
      });
    });
    sum.appendChild(val);
    if (/^CONFLITO/i.test(it.nota)) sum.appendChild(el('span', 'conflito', '⚠ fontes divergem'));
    det.appendChild(sum);

    var box = el('div', 'detalhe');
    if (it.nota && !soData) box.appendChild(el('p', 'nota', it.nota));
    if (soData) {
      // só a data de atualização
    } else if (it.fontes.length) {
      var ul = el('ul');
      it.fontes.forEach(function (f) {
        var li = el('li');
        var a = el('a', null, f.titulo);
        a.href = f.url; a.target = '_blank'; a.rel = 'noopener';
        li.appendChild(a);
        ul.appendChild(li);
      });
      box.appendChild(ul);
    } else {
      box.appendChild(el('p', null, 'Sem fonte registrada.'));
    }
    // data do dado na fonte (coluna data_coleta): AAAA → "dados de 2023"; AAAA-MM → "dados de jul/2026";
    // AAAA-MM-DD → "atualizado em 24/11/2026". Sem data (links, parágrafos de resumo), nada aparece.
    var quando = dataDoDado(it.data);
    if (quando && it.variavel !== 'descricao') box.appendChild(el('p', null, quando));
    det.appendChild(box);
    return det;
  }

  function dataDoDado(d) {
    var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    if (!d) return '';
    if (/^\d{4}$/.test(d)) return 'dados de ' + d;
    if (/^\d{4}-\d{2}$/.test(d)) return 'dados de ' + MES[+d.slice(5) - 1] + '/' + d.slice(0, 4);
    return 'atualizado em ' + d.split('-').reverse().join('/');
  }

  // ---- fundo vetorial do mapa (OpenStreetMap via Protomaps; ver scripts/fundo_mapa.py) ----
  function decPolyline(s) {
    var i = 0, lat = 0, lng = 0, out = [];
    while (i < s.length) {
      var b, sh = 0, r = 0;
      do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      lat += (r & 1) ? ~(r >> 1) : (r >> 1);
      sh = 0; r = 0;
      do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      lng += (r & 1) ? ~(r >> 1) : (r >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  // fundo compactado (gzip + base64, ver gerar_ficha.py): descompactado pelo próprio navegador
  function abrirFundo(F, pronto) {
    if (!F.gz) { pronto(F); return; }
    if (F.aberto) { pronto(F.aberto); return; }
    if (typeof DecompressionStream === 'undefined') return;   // navegador antigo: mapa sem fundo
    var bin = atob(F.gz), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function (t) {
      var x = JSON.parse(t);
      x.limites = F.limites;
      F.aberto = x;
      pronto(x);
    });
  }

  function fundoVetorial(mapaL, F) {
    var escuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    var C = escuro
      ? { mar: '#1c2b36', terra: '#212327', verde: '#23352a', areia: '#3a3628', aero: '#2b2b31', expressa: '#9a7a3e', principal: '#4b4e56', rua: '#35383e', balsa: '#4a6b80' }
      : { mar: '#aad3df', terra: '#f3f0ea', verde: '#d3e7c3', areia: '#f4e8c4', aero: '#e7e4ec', expressa: '#f6c56a', principal: '#ffffff', rua: '#ffffff', balsa: '#6a9fbf' };
    mapaL.getContainer().style.background = C.mar;
    // painel próprio abaixo das linhas e marcadores: o fundo pode chegar depois (descompactação assíncrona)
    if (!mapaL.getPane('fundo')) mapaL.createPane('fundo').style.zIndex = 250;
    var tinta = L.canvas({ padding: 0.4, pane: 'fundo' }), g = F.grupos;
    function area(lista, cor) {
      if (!lista) return;
      L.polygon(lista.map(function (p) { return p.map(decPolyline); }),
        { renderer: tinta, stroke: false, fillColor: cor, fillOpacity: 1, interactive: false }).addTo(mapaL);
    }
    area(g.terra, C.terra); area(g.aeroporto, C.aero); area(g.verde, C.verde); area(g.areia, C.areia); area(g.agua, C.mar);
    // espessura (px) por nível de zoom, de 11 a 17
    var LARG = { rio: [1, 1, 2, 2, 3, 3, 4], rua: [0, 0, 0, 1.5, 2.5, 4, 7], principal: [1, 1.5, 2.5, 3.5, 5, 7, 10],
                 expressa: [2, 2.5, 3.5, 4.5, 6, 8, 11], balsa: [1, 1, 1.5, 1.5, 2, 2, 2] };
    var linhas = [['rio', g.rio, C.mar], ['balsa', g.balsa, C.balsa], ['rua', g.rua, C.rua],
                  ['principal', g.via_principal, C.principal], ['expressa', g.via_expressa, C.expressa]]
      .filter(function (l) { return l[1]; })

      no('rect', { x: x(i) - larg / 2, y: y(v), width: larg, height: Math.max(0, y(0) - y(v)), fill: o.corBarra, 'fill-opacity': o.linha ? 0.45 : 0.75, rx: 1.5 });
    });
    if (o.linha) no('polyline', { points: o.linha.map(function (v, i) { return x(i) + ',' + y(v); }).join(' '), fill: 'none', stroke: o.corLinha, 'stroke-width': 2 });
    MESES.forEach(function (m, i) { var t = no('text', { x: x(i), y: H - 6, 'text-anchor': 'middle', 'font-size': 10, fill: 'currentColor', 'fill-opacity': 0.7 }); t.textContent = m[0].toUpperCase(); });
    var bloco = document.createElement('div');
    bloco.appendChild(el('div', 'grafico-titulo', o.titulo));
    bloco.appendChild(svg);
    return bloco;
  }

  // ---------- mapa de moradia (toque livre) ----------
  function fmtN(v) { return Math.round(v).toLocaleString('pt-BR'); }
  function mapa(m) {
    var ns = 'http://www.w3.org/2000/svg';
    var G = m.grade, P = m.proj, VB = m.viewbox;
    var box = el('div', 'mapa');
    var tela = el('div', 'mapa-tela');
    var svg = document.createElementNS(ns, 'svg');
    var vb = VB.slice();
    var estrela, marca;
    function px() { return vb[2] / (svg.clientWidth || 360); }
    function aplicar() {
      svg.setAttribute('viewBox', vb.join(' '));
      if (estrela) estrela.setAttribute('font-size', 24 * px());
      if (marca) { marca.setAttribute('r', 7 * px()); marca.setAttribute('stroke-width', 3 * px()); }
    }
    function novo(tag, at) {
      var e = document.createElementNS(ns, tag);
      for (var k in at) e.setAttribute(k, at[k]);
      return e;
    }
    svg.appendChild(novo('path', { d: m.contorno, 'class': 'terra' }));
    m.linhas.forEach(function (l) {
      var p = novo('path', { d: l.d, 'class': 'linha', stroke: l.cor });
      p.style.strokeWidth = l.larg * 1.6 + 'px';
      svg.appendChild(p);
    });
    estrela = novo('text', { x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#1d1f22', stroke: '#fff', 'stroke-width': '1.5', 'class': 'estrela' });
    estrela.textContent = '★';
    marca = novo('circle', { cx: 0, cy: 0, r: 7, 'class': 'marca' });
    marca.style.display = 'none';
    svg.appendChild(marca);
    svg.appendChild(estrela);

    var info = el('div', 'mapa-info');
    var horario = 'normal', ultimo = [0, 0];
    var seletor = el('div', 'mapa-horario');
    [['normal', 'Horário normal'], ['pico', 'Horário de pico']].forEach(function (h) {
      var b = el('button', h[0] === horario ? 'ativo' : null, h[1]);
      b.onclick = function () {
        horario = h[0];
        Array.prototype.forEach.call(seletor.children, function (c) { c.classList.remove('ativo'); });
        b.classList.add('ativo'); mostrar(ultimo[0], ultimo[1]);
      };
      seletor.appendChild(b);
    });

    function celula(x, y) {
      var c = Math.floor((x - G.x0) / G.passo), r = Math.floor((y - G.y0) / G.passo);
      if (c < 0 || r < 0 || c >= G.cols || r >= G.rows) return -1;
      return r * G.cols + c;
    }
    function geo(x, y) { return [P.lon0 + x / 100 / P.kx, P.lat0 - y / 100 / P.ky]; }
    function linkPortal(url, area, x, y) {
      var ll = geo(x, y), d = 0.012;
      var sub = { lat: ll[1].toFixed(5), lon: ll[0].toFixed(5), latmin: (ll[1] - d).toFixed(5), latmax: (ll[1] + d).toFixed(5),
                  lonmin: (ll[0] - d).toFixed(5), lonmax: (ll[0] + d).toFixed(5),
                  area_slug: area ? area.slug : '', area_pnome: area ? area.pnome : '', cep: area ? area.cep : '' };
      return url.replace(/\{(\w+)\}/g, function (_, k) { return sub[k] !== undefined ? sub[k] : ''; });
    }
    function linhaInfo(rot, val) {
      var l = el('div', 'mi-linha'); l.appendChild(el('span', 'mi-rot', rot)); l.appendChild(el('span', 'mi-val', val)); return l;
    }
    function mostrar(x, y) {
      ultimo = [x, y];
      var k = celula(x, y);
      info.textContent = '';
      if (k < 0 || G.t[k] < 0) {
        esconderMarca();
        info.appendChild(el('div', 'mi-aviso', 'Ponto fora da área coberta pelo mapa.'));
        return;
      }
      porMarca(x, y);
      var area = G.a[k] >= 0 ? m.areas[G.a[k]] : null;
      info.appendChild(el('div', 'nome', area ? area.nome : 'Ponto escolhido'));
      // deslocamento
      var t = G.t[k], e = G.e[k], w = G.w[k];
      var dkm = Math.hypot(x, y) / 100, C = m.carro;
      if (C.osrm) {
        // sem índice de trânsito para a cidade: tempo de rota do OpenStreetMap, sem trânsito
        info.appendChild(linhaInfo('Carro (sem trânsito)', G.c[k] >= 0 ? '≈ ' + Math.max(1, G.c[k]) + ' min' : 'sem informação'));
      } else {
        var carro = Math.round(C.fixo + dkm * C.desvio * C[horario] / 10);
        if (!m.sem_transporte) info.appendChild(linhaInfo('Transporte público', '≈ ' + t + ' min'));
        info.appendChild(linhaInfo('Carro (' + (horario === 'pico' ? 'pico' : 'horário normal') + ')', '≈ ' + carro + ' min'));
      }
      if (m.sem_transporte) {
        info.appendChild(linhaInfo('Transporte público', 'sem informação'));
      } else if (e >= 0) {
        var nomeE = m.estacoes[e], rotE = nomeE === 'ponto de ônibus' ? 'Embarque' : 'Estação';
        info.appendChild(linhaInfo(rotE, nomeE + (w < 0 ? ' (ônibus, ≈ ' + (-w) + ' min)' : ' (' + w + ' min a pé)')));
      } else {
        var cx = G.x0 + (k % G.cols + 0.5) * G.passo, cy = G.y0 + (Math.floor(k / G.cols) + 0.5) * G.passo;
        var pe = Math.hypot(cx, cy) / 100 * m.caminhada_min_km;
        info.appendChild(linhaInfo('Estação', Math.abs(pe - t) < 1 ? 'nenhuma — a pé até o posto' : 'nenhuma — ônibus até o posto'));
      }
      // aluguel
      var al = area && area.ref !== null ? m.aluguel[String(area.ref)] : null;
      if (al) {
        var ref = m.areas[area.ref].nome !== area.nome ? ' (referência: ' + al.rotulo + ')' : '';
        info.appendChild(el('div', 'mi-sub', 'Aluguel' + ref));
        ['1', '2', '3'].forEach(function (q) {
          var v = al.q[q]; if (!v) return;
          var local = al.moeda + ' ' + fmtN(v.local) + (al.periodo === 'semana' ? '/semana' : '');
          info.appendChild(linhaInfo(q + (q === '1' ? ' quarto' : ' quartos'), 'USD ' + fmtN(v.usd) + '/mês' + (al.moeda === 'USD' ? '' : ' · ' + local)));
        });
        info.appendChild(el('div', 'mi-fonte', al.fonte));
      } else {
        info.appendChild(linhaInfo('Aluguel', 'sem informação'));
      }
      // link genérico (sem {marcador} no endereço) não leva à área tocada: o texto não promete isso
      if (m.portais.length === 1) {
        var p1 = m.portais[0];
        var a = el('a', 'mi-link', 'Ver anúncios ' + (p1.url.indexOf('{') >= 0 ? 'nesta área ' : '') + 'no ' + p1.nome + ' →');
        a.href = linkPortal(p1.url, area, x, y); a.target = '_blank'; a.rel = 'noopener';
        info.appendChild(a);
      } else if (m.portais.length > 1) {
        var lp = el('div', 'mi-link');
        lp.appendChild(document.createTextNode('Ver anúncios: '));
        m.portais.forEach(function (p, i) {
          if (i) lp.appendChild(document.createTextNode(' · '));
          var ap = el('a', null, p.nome + (p.url.indexOf('{') >= 0 ? ' (nesta área)' : ''));
          ap.href = linkPortal(p.url, area, x, y); ap.target = '_blank'; ap.rel = 'noopener';
          lp.appendChild(ap);
        });
        info.appendChild(lp);
      }
    }

    function pontoSvg(e) {
      var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }
    function zoom(f) {
      var cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
      var w = Math.min(VB[2] * 1.2, Math.max(VB[2] / 40, vb[2] / f)), h = w * vb[3] / vb[2];
      vb = [cx - w / 2, cy - h / 2, w, h]; aplicar();
    }
    var ini = null, arrastou = false;
    svg.addEventListener('pointerdown', function (e) { ini = [e.clientX, e.clientY, vb[0], vb[1]]; arrastou = false; });
    svg.addEventListener('pointermove', function (e) {
      if (!ini) return;
      var r = svg.getBoundingClientRect(), k = vb[2] / r.width;
      if (Math.abs(e.clientX - ini[0]) + Math.abs(e.clientY - ini[1]) > 6) arrastou = true;
      if (!arrastou) return;
      vb[0] = ini[2] - (e.clientX - ini[0]) * k; vb[1] = ini[3] - (e.clientY - ini[1]) * k; aplicar();
    });
    svg.addEventListener('pointerup', function (e) {
      if (ini && !arrastou) { var p = pontoSvg(e); mostrar(p.x, p.y); }
      ini = null;
    });
    window.addEventListener('pointerup', function () { ini = null; });

    function esconderMarca() { marca.style.display = 'none'; }
    function porMarca(x, y) { marca.setAttribute('cx', x); marca.setAttribute('cy', y); marca.style.display = ''; }

    if (window.L) {
      // mapa de ruas (CARTO/OpenStreetMap); a lógica de toque é a mesma
      var div = el('div', 'leaflet');
      box.appendChild(div);
      box.appendChild(el('div', 'mapa-dica', 'Toque em qualquer ponto do mapa. ★ = posto.'));
      if (!m.carro.osrm) box.appendChild(seletor);
      box.appendChild(info);
      setTimeout(function () {
        var mapaL = L.map(div, { zoomControl: true, minZoom: 11, maxZoom: 17 }).setView([P.lat0, P.lon0], 13);
        div.mapaL = mapaL;   // referência para testes automáticos
        if (d.fundo) {
          // fundo desenhado aqui mesmo, sem imagens de fora (o SharePoint bloqueia)
          var lim = d.fundo.limites;
          mapaL.setMaxBounds([[lim[0], lim[1]], [lim[2], lim[3]]]).options.maxBoundsViscosity = 1;
          abrirFundo(d.fundo, function (F) { fundoVetorial(mapaL, F); });
          mapaL.attributionControl.setPrefix(false).addAttribution('&copy; OpenStreetMap');
        }
        m.linhas.forEach(function (l) {
          if (l.larg < 0.9) return;
          L.polyline(l.geo, { color: l.cor, weight: l.larg * 1.8, opacity: 0.7, interactive: false }).addTo(mapaL);
        });
        if (m.estacoes_geo && m.estacoes_geo.length) {
          // estações: bolinha a partir do zoom 13, nome a partir do 15
          var tintaE = L.canvas({ padding: 0.4 });
          var estB = m.estacoes_geo.map(function (s) {
            return L.circleMarker([s[1], s[2]], { renderer: tintaE, radius: 3, color: '#1d1f22', weight: 1.5,
              fillColor: '#ffffff', fillOpacity: 1, interactive: false });
          });
          var estN = m.estacoes_geo.map(function (s) {
            return L.marker([s[1], s[2]], { interactive: false, keyboard: false,
              icon: L.divIcon({ className: 'rotulo-estacao', html: s[0], iconSize: null }) });
          });
          var ajustarEst = function () {
            var z = mapaL.getZoom();
            // paradas só de bonde/VLT (s[3] = 1) entram dois níveis de zoom depois
            estB.forEach(function (b, i) {
              var menor = m.estacoes_geo[i][3], zb = menor ? 15 : 13;
              if (z >= zb) { b.setRadius(z >= 15 && !menor ? 5 : 3); if (!mapaL.hasLayer(b)) b.addTo(mapaL); } else mapaL.removeLayer(b);
            });
            estN.forEach(function (n, i) {
              if (z >= (m.estacoes_geo[i][3] ? 16 : 15)) { if (!mapaL.hasLayer(n)) n.addTo(mapaL); } else mapaL.removeLayer(n);
            });
          };
          mapaL.on('zoomend', ajustarEst);
          ajustarEst();
        }
        L.marker([P.lat0, P.lon0], { interactive: false, icon: L.divIcon({ className: 'estrela-ll', html: '★', iconSize: [26, 26] }) }).addTo(mapaL);
        var circ = null;
        esconderMarca = function () { if (circ) { mapaL.removeLayer(circ); circ = null; } };
        porMarca = function (x, y) {
          var ll = geo(x, y);
          if (!circ) circ = L.circleMarker([ll[1], ll[0]], { radius: 8, color: '#1f5c44', weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(mapaL);
          else circ.setLatLng([ll[1], ll[0]]);
        };
        mapaL.on('click', function (e) {
          mostrar((e.latlng.lng - P.lon0) * P.kx * 100, -(e.latlng.lat - P.lat0) * P.ky * 100);
        });
        mostrar(0, 0);
        var det = div.closest('details');
        if (det) det.addEventListener('toggle', function () {
          if (det.open) { mapaL.invalidateSize(); mapaL.setView([P.lat0, P.lon0], 13); }
        });
      }, 0);
      return box;
    }

    tela.appendChild(svg);
    var zb = el('div', 'mapa-zoom');
    var mais = el('button', null, '+'), menos = el('button', null, '−');
    mais.onclick = function () { zoom(1.6); }; menos.onclick = function () { zoom(1 / 1.6); };
    zb.appendChild(mais); zb.appendChild(menos); tela.appendChild(zb);
    box.appendChild(tela);
    box.appendChild(el('div', 'mapa-dica', 'Toque em qualquer ponto do mapa. ★ = posto.'));
    box.appendChild(seletor);
    box.appendChild(info);
    // começa com ~16 km de largura centrado no posto e com o posto selecionado
    var larg = Math.min(VB[2], 1600);
    vb = [-larg / 2, -larg / 2 * 340 / 360, larg, larg * 340 / 360];
    aplicar();
    setTimeout(function () { var r = svg.clientHeight / (svg.clientWidth || 360); vb[3] = vb[2] * r; vb[1] = -vb[3] / 2; aplicar(); }, 0);
    mostrar(0, 0);
    return box;
  }

  var app = document.getElementById('app');
  // o link "← Postos" fica no HTML, não é criado aqui: no SharePoint, links criados por script não abrem
  app.appendChild(el('div', 'local', d.cidade + ' · ' + d.pais));
  app.appendChild(el('h1', null, d.posto));
  app.appendChild(el('p', 'endereco', d.endereco));

  var leg = el('div', 'legenda');
  ['alta', 'media', 'baixa'].forEach(function (c) {
    var s = el('span'); s.appendChild(selo(c)); s.appendChild(document.createTextNode(' ' + CONF_TXT[c]));
    leg.appendChild(s);
  });
  app.appendChild(leg);

  var blocoAtual = null, alvo = app;
  d.temas.forEach(function (t) {
    if (t.bloco && t.bloco !== blocoAtual) {
      blocoAtual = t.bloco; alvo = el('details', 'bloco'); alvo.open = false;
      alvo.appendChild(el('summary', null, t.bloco)); app.appendChild(alvo);
    }
    var sec = el('details', 'tema');
    sec.open = false;
    sec.appendChild(el('summary', null, t.icone + '  ' + t.rotulo));
    if (t.tema === 'fuso' && d.fuso_iana) sec.appendChild(relogios());
    if (t.tema === 'moradia' && d.mapa) sec.appendChild(mapa(d.mapa));
    // no clima, o resumo em texto vem antes do gráfico
    var antes = t.tema === 'clima' ? t.itens.filter(function (it) { return it.variavel === 'descricao'; }) : [];
    antes.forEach(function (it) { sec.appendChild(item(it, t.tema)); });
    if (t.tema === 'clima' && d.clima && d.clima.length === 12) sec.appendChild(graficoClima(d.clima));
    if (t.tema === 'custo_vida' && d.custo && d.custo.length) sec.appendChild(graficoCusto(d.custo));
    if (t.tema === 'custo_vida' && d.alimentos) sec.appendChild(graficoAlimentos(d.alimentos, d.cidade));
    if (t.tema === 'presenca' && d.comunidade) sec.appendChild(graficoComunidade(d.comunidade));
    var duasRef = t.tema === 'cambio' && d.cambio && d.cambio.serie_brl;
    if (duasRef) { sec.setAttribute('data-ref', 'usd'); sec.appendChild(seletorReferencia(sec)); }
    if (t.tema === 'cambio' && d.cambio && d.cambio.serie.length > 1) {
      sec.appendChild(graficoCambio(d.cambio, false));
      if (duasRef) sec.appendChild(graficoCambio(d.cambio, true));
    }
    t.itens.forEach(function (it) {
      if (antes.indexOf(it) >= 0) return;
      var no = item(it, t.tema);
      if (duasRef) {
        if (/_brl$/.test(it.variavel)) no.classList.add('ref-brl');
        else if (it.variavel === 'cotacao') no.classList.add('ref-usd');
      }
      sec.appendChild(no);
    });
    alvo.appendChild(sec);
  });

  app.appendChild(el('footer', null, 'Toque em um item para ver a fonte.'));
})();
</script>
</body>
